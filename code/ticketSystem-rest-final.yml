  # ============================================================
  # API Deployment & Stage
  # ============================================================
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - PostTicketsMethod
      - GetTicketsMethod
      - GetTicketByIdMethod
      - PutTicketMethod
      - DeleteTicketMethod
      - OptionsTicketsMethod
      - OptionsTicketByIdMethod
      - GatewayResponseDefault4XX
      - GatewayResponseDefault5XX
      - GatewayResponseUnauthorized
      - GatewayResponseAccessDenied
    Properties:
      RestApiId: !Ref TicketSystemApi
      Description: !Sub "v${DeploymentVersion} - ${Environment}"

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref TicketSystemApi
      DeploymentId: !Ref ApiDeployment
      StageName: !Ref Environment
      Description: !Sub ${Environment} stage

  # Lambda Permission for API Gateway
  LambdaApiGatewayPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt TicketSystemFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${TicketSystemApi}/*

# ============================================================
# Outputs
# ============================================================
Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub https://${TicketSystemApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}

  PostTicketEndpoint:
    Description: POST endpoint to create a new ticket (public)
    Value: !Sub https://${TicketSystemApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/tickets

  GetTicketsEndpoint:
    Description: GET endpoint to retrieve tickets (supports ?userId= and ?severity=)
    Value: !Sub https://${TicketSystemApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/tickets

  GetTicketByIdEndpoint:
    Description: GET endpoint to retrieve a single ticket by ID
    Value: !Sub https://${TicketSystemApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/tickets/{ticketId}

  UpdateTicketEndpoint:
    Description: PUT endpoint to update a ticket (Admin auth required)
    Value: !Sub https://${TicketSystemApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/tickets/{ticketId}

  DeleteTicketEndpoint:
    Description: DELETE endpoint to delete a ticket (Admin auth required)
    Value: !Sub https://${TicketSystemApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}/tickets/{ticketId}

  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool

  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref UserPoolClient

  UserPoolDomain:
    Description: Cognito hosted UI domain
    Value: !Sub https://ticketsystem-${Environment}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com

  TicketsTableName:
    Description: DynamoDB Tickets table name
    Value: !Ref TicketsTable

  UsersTableName:
    Description: DynamoDB Users table name
    Value: !Ref UsersTable

  LambdaFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt TicketSystemFunction.Arn
